name: Sync asks from Sheets

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-asks
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Import asks and preserve responses
        env:
          ASK_SYNC_TOKEN: ${{ secrets.ASK_SYNC_TOKEN }}
          ASK_SCRIPT_URL: ${{ vars.ASK_SCRIPT_URL }}
        run: node scripts/sync-asks.mjs

      - name: Commit new asks
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- data/ask.json; then
            echo "No new asks to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ask.json
          git commit -m "Import new asks from Google Sheets"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish updated inbox
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
